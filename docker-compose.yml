name: map-platform

services:
  rsa-pki:
    image: map-platform-rsa-pki
    build:
      context: ./infrastructure/local/pki
    command: generate
    volumes:
      - rsa-pki-public:/pki/public
      - rsa-pki-private:/pki/private
    restart: "no"

  rsa-pki-validator:
    image: map-platform-rsa-pki
    profiles: ["tools"]
    command: validate
    environment:
      MAP_HOST: ${MAP_HOST:-localhost}
      TLS_CONNECT_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rsa-pki-public:/pki/public:ro

  osm-import:
    image: iboates/osm2pgsql:2.2.0
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/data:ro
      - ./infrastructure/local/osm:/config:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./infrastructure/local/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/local/postgres/places:/places:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - rsa-pki-public:/local-pki:ro
    depends_on:
      rsa-pki:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  tiles:
    image: ghcr.io/maplibre/martin:1.11.0
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${TILE_PORT:-3000}:3000"
    volumes:
      - ./infrastructure/local/martin:/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      MAP_HOST: ${MAP_HOST:-localhost}
    ports:
      - "0.0.0.0:${WEB_PORT:-5173}:5173"
      - "0.0.0.0:${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - rsa-pki-public:/pki/public:ro
      - rsa-pki-private:/pki/private:ro
    depends_on:
      rsa-pki:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      tiles:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5173/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgis-data:
  caddy-data:
  caddy-config:
  rsa-pki-public:
  rsa-pki-private:
